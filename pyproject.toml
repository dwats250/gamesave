[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamesave"
version = "0.2.0"
description = "Manifest-based retro game save and save-state sync tool"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "gamesave" }]

[project.scripts]
gamesave = "gamesave.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gamesave*"]
